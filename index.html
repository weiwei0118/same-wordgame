<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同詞默契｜多人連線</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#28233a;background:#f5f2ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:650px;margin:24px auto}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 32px #64529b17;margin:16px 0}h1{font-size:36px;margin:0}h2{margin:0 0 12px}.muted{color:#78738a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}input,select,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ddd7ee}input{width:100%;margin:8px 0}button{border:0;background:#7754da;color:#fff;cursor:pointer;font-weight:700}button.secondary{background:#eee9ff;color:#6145ad}button:disabled{opacity:.5}.hidden{display:none}.pill{display:inline-block;background:#eee9ff;padding:8px 12px;border-radius:30px;margin:4px}.big{font-size:44px;font-weight:800;color:#7754da}.result{padding:12px;border-bottom:1px solid #eee}.success{color:#14835a}#msg{color:#b73751;min-height:20px}code{word-break:break-all}</style></head><body><main><p class="muted">SAME WORD · 多人線上默契挑戰</p><h1>同詞默契 ✨</h1><p>大家各自寫一個詞，全部相同就過關！不同就根據結果繼續聯想。</p><section id="setup" class="card"><h2>首次設定 Firebase</h2><p class="muted">請先將 index.html 裡的 <code>firebaseConfig</code> 替換為你自己的 Firebase 網頁設定，並啟用匿名登入和 Firestore。</p></section><section id="home" class="card hidden"><h2>開始玩</h2><label>你的暱稱</label><input id="name" maxlength="16" placeholder="例如：小明"><label>每輪秒數</label><select id="seconds"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option></select><p><button id="create">建立房間</button></p><hr><label>加入好友房間</label><input id="code" maxlength="6" placeholder="輸入 6 碼房號"><button id="join">加入房間</button></section><section id="game" class="hidden"><div class="card"><div class="row"><div><span class="muted">房間代碼</span><h2 id="roomCode"></h2></div><button class="secondary" id="copy">複製邀請連結</button></div><div id="players"></div></div><div class="card" id="content"></div></section><p id="msg" role="status"></p><p class="muted" style="font-size:12px">房間資料存放於 Firebase。此版本適合朋友間休閒遊玩；房主需保持頁面開啟以管理倒數與揭曉。</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
// ↓ 從 Firebase 專案設定 > 你的應用程式 > 網頁應用程式複製設定，取代下方內容
const firebaseConfig={apiKey:'PASTE_API_KEY',authDomain:'PASTE_PROJECT_ID.firebaseapp.com',projectId:'PASTE_PROJECT_ID',appId:'PASTE_APP_ID'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>$('msg').textContent=s||'';const params=new URLSearchParams(location.search);$('code').value=(params.get('room')||'').toUpperCase();
if(firebaseConfig.apiKey==='PASTE_API_KEY'){msg('請先完成 Firebase 設定。');throw Error('Firebase 尚未設定')}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid=null,roomId=null,state=null,unsub=null,busy=false;
const roomRef=c=>doc(db,'rooms',c),playerRef=(c,id)=>doc(db,'rooms',c,'players',id);
const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function code(){return Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>alphabet[x%alphabet.length]).join('')}
const nickname=()=> $('name').value.trim().slice(0,16);const fail=e=>{console.error(e);msg(e?.message||String(e))};
async function create(){if(!nickname())return msg('請先輸入暱稱');if(busy)return;busy=true;try{let c;for(let i=0;i<8;i++){c=code();if(!(await getDoc(roomRef(c))).exists())break}const seconds=Number($('seconds').value);await setDoc(roomRef(c),{host:uid,phase:'lobby',round:0,seconds,deadline:0,createdAt:serverTimestamp(),history:[]});await setDoc(playerRef(c,uid),{name:nickname(),joinedAt:Date.now(),word:'',round:0});enter(c)}catch(e){fail(e)}finally{busy=false}}
async function join(){const c=$('code').value.trim().toUpperCase();if(!nickname())return msg('請先輸入暱稱');if(!/^[A-Z2-9]{6}$/.test(c))return msg('請輸入六碼房號');try{const snap=await getDoc(roomRef(c));if(!snap.exists())return msg('找不到房間');const p=await getDoc(playerRef(c,uid));if(!p.exists()){if(snap.data().phase!=='lobby')return msg('遊戲已開始，請等下一局');const players=await getDoc(roomRef(c));if(!players.exists())return msg('房間已關閉');await setDoc(playerRef(c,uid),{name:nickname(),joinedAt:Date.now(),word:'',round:0})}enter(c)}catch(e){fail(e)}}
function enter(c){roomId=c;history.replaceState(null,'','?room='+c);$('home').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=c;unsub?.();unsub=onSnapshot(roomRef(c),async snap=>{if(!snap.exists())return msg('房間不存在');const s=snap.data();const {getDocs,collection}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');const ps=await getDocs(collection(db,'rooms',c,'players'));state={...s,players:ps.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.joinedAt-b.joinedAt)};render();},fail); // player changes also need a listener
playerUnsub?.();playerUnsub=onSnapshot((()=>{const {collection}=firestoreHelpers;return collection(db,'rooms',c,'players')})(),snap=>{if(!state)return;state.players=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.joinedAt-b.joinedAt);render()},fail);msg('')}
import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const firestoreHelpers={collection};let playerUnsub=null;
async function start(){if(!state||state.host!==uid)return;if(state.players.length<2)return msg('至少需要 2 位玩家才能開始');const next=state.round+1;await updateDoc(roomRef(roomId),{phase:'writing',round:next,deadline:Date.now()+state.seconds*1000})}
async function submit(){const word=$('word')?.value.trim().slice(0,30);if(!word)return msg('請輸入一個詞');if(state.phase!=='writing'||Date.now()>state.deadline)return msg('本輪已截止');try{await updateDoc(playerRef(roomId,uid),{word,round:state.round});msg('已送出！')}catch(e){fail(e)}}
async function reveal(){if(!state||state.host!==uid||state.phase!=='writing')return;const ps=state.players;if(ps.length<2)return;const complete=ps.every(p=>p.round===state.round&&p.word);if(!complete&&Date.now()<state.deadline)return;const words=ps.map(p=>({name:p.name,word:p.round===state.round?p.word:'（未作答）'}));const norm=words.map(w=>w.word.trim().toLocaleLowerCase());const won=complete&&norm.every(w=>w===norm[0]);await updateDoc(roomRef(roomId),{phase:won?'won':'reveal',deadline:0,history:[...(state.history||[]),{round:state.round,words}]})}
async function next(){if(state?.host!==uid)return;await start()}
function render(){const draft=$('word')?.value||'';const s=state;if(!s)return;const host=s.host===uid;const mine=s.players.find(p=>p.id===uid);$('players').innerHTML=s.players.map(p=>`<span class="pill">${esc(p.name)} ${p.id===s.host?'👑':''} ${s.phase==='writing'&&p.round===s.round&&p.word?'✓':''}</span>`).join('');let html='';if(s.phase==='lobby')html=`<h2>等待好友加入…</h2><p>${s.players.length} 人已加入（建議 2–8 人）</p>${host?'<button id="start">開始遊戲</button>':'<p class="muted">等待房主開始</p>'}`;if(s.phase==='writing'){const sent=mine?.round===s.round&&mine?.word;html=`<p>第 ${s.round} 輪 · 寫下你想到的詞</p><div class="big" id="timer">--</div><input id="word" maxlength="30" placeholder="輸入一個詞" ${sent?'disabled':''}><button id="submit" ${sent?'disabled':''}>${sent?'已送出':'送出答案'}</button><p class="muted">已送出 ${s.players.filter(p=>p.round===s.round&&p.word).length}/${s.players.length} 人</p>${host?'<button class="secondary" id="reveal">揭曉結果</button>':''}`}
if(s.phase==='reveal'||s.phase==='won'){const h=s.history?.at(-1);html=`<h2 class="${s.phase==='won'?'success':''}">${s.phase==='won'?'🎉 默契成功！':'第 '+s.round+' 輪結果'}</h2>${(h?.words||[]).map(w=>`<div class="result">${esc(w.name)}：<b>${esc(w.word)}</b></div>`).join('')}<p class="muted">${s.phase==='won'?'大家想到一樣的詞！':'參考大家的詞，下一輪繼續聯想！'}</p>${host?`<button id="next">${s.phase==='won'?'再玩一局':'下一輪'}</button>`:'<p>等待房主操作…</p>'}`}
$('content').innerHTML=html;if($('word')&&!$('word').disabled)$('word').value=draft;for(const [id,fn] of [['start',start],['submit',submit],['reveal',reveal],['next',next]])if($(id))$(id).onclick=()=>fn().catch(fail);if($('word'))$('word').onkeydown=e=>{if(e.key==='Enter')$('submit').click()};tick()}
function tick(){if(!state||state.phase!=='writing')return;const remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if($('timer'))$('timer').textContent=remain+' 秒';if(state.host===uid&&(remain===0||state.players.length>=2&&state.players.every(p=>p.round===state.round&&p.word))&&!busy){busy=true;reveal().catch(fail).finally(()=>busy=false)}}setInterval(tick,500);
$('create').onclick=create;$('join').onclick=join;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);msg('已複製邀請連結！')}catch{msg('請複製網址列的連結')}};
signInAnonymously(auth).then(()=>onAuthStateChanged(auth,user=>{uid=user?.uid||null;if(uid){$('setup').classList.add('hidden');$('home').classList.remove('hidden')}})).catch(e=>msg('Firebase 登入失敗：'+e.message));
</script></body></html>
